<div id="stage"></div>
<div class="top"><span><b>Smudge 3D</b> · test page, not in the game yet · drag to turn him · outfits, gear and fur</span><span id="fps"></span></div>
<div id="msg">Loading Smudge…</div>
<div class="bar" id="bar"></div>
<script type="module">
import { mount } from '/js/smudge3d.js';
const stage = document.getElementById('stage'), bar = document.getElementById('bar');
const BG = ['archive', 'dock', 'bondi', 'fjord', 'speakeasy', 'vault', 'closet', 'outback', 'blackforest'];
// models: the same rig in three outfits. Every accessory is placed in metres against a bone, so one set of
// numbers fits all three.
const MODEL = { cloak: ['Cloak', '/assets/v2/3d/smudge_cloak.glb'], bare: ['No outfit', '/assets/v2/3d/smudge_tail.glb'], speakeasy: ['1920s outfit', '/assets/v2/3d/smudge_1920s.glb'] };
const W = '/assets/v2/3d/wear/';
const GEAR = {
  satchel: ['Satchel', { src: W + 'satchel.glb', bone: 'Spine01', pos: [0, 0.01, -0.1], rot: [0.12, Math.PI, 0], scale: 0.33 }],
  crown:   ['Crown', { src: W + 'crown.glb', bone: 'Head', pos: [0, 0.16, -0.015], rot: [-0.15, 0, 0], scale: 0.15 }],
  glasses: ['Glasses', { src: W + 'glasses.glb', bone: 'Head', pos: [0, 0.07, -0.02], rot: [0.08, 0, 0], scale: 0.21, clear: true }],
  rocket:  ['Rocket pack', { src: W + 'rocket.glb', bone: 'Spine01', pos: [0, 0.03, -0.14], rot: [0, Math.PI, 0], scale: 0.32, flames: [[-0.053, -0.151, 0.048], [0.05, -0.151, 0.049]] }],
  rod:     ['1920s rod', { src: W + 'rod.glb', bone: 'RightHand', pos: [-0.005, 0.112, 0.228], rot: [0, Math.PI / 2, 0], scale: 0.55 }],
  shovel:  ['Roman spade', { src: W + 'shovel.glb', bone: 'LeftHand', pos: [0.01, -0.13, 0.02], scale: 0.5 }],
};
const FUR = { natural: ['Natural fur', null], plum: ['Plum', { hue: -0.5, sat: 0.7, val: 0.85 }], arctic: ['Arctic', { hue: 0, sat: 0.12, val: 1.35 }],
  golden: ['Golden', { hue: 0.18, sat: 1.25, val: 1.15 }], midnight: ['Midnight', { hue: 2.6, sat: 0.55, val: 0.55 }] };

async function build() {
  const my = ++busy; document.getElementById('msg').style.display = '';
  if (st.model === 'cloak' && st.gear.rocket) st.gear.satchel = false;     // both go on his back

  if (my !== busy) { n.dispose(); return; }
  if (s) s.dispose(); stage.innerHTML = ''; stage.appendChild(el); s = n; window.S = s;

function setBg() { stage.style.backgroundImage = `url(/assets/v2/scenes/${BG[st.bg]}.webp)`; }
function row(t) { const r = document.createElement('div'); r.className = 'row'; if (t) r.innerHTML = `<i>${t}</i>`; bar.appendChild(r); return r; }
function btn(r, label, on, fn) { const b = document.createElement('button'); b.textContent = label; if (on) b.className = 'on'; b.onclick = () => { fn(); ui(); }; r.appendChild(b); }
function ui() {
  bar.innerHTML = '';
  let r = row('Outfit'); Object.entries(MODEL).forEach(([k, [l]]) => btn(r, l, st.model === k, () => { st.model = k; build(); }));
  r = row('Gear'); Object.entries(GEAR).forEach(([k, [l]]) => btn(r, l, !!st.gear[k], () => { st.gear[k] = !st.gear[k]; if (k === 'rocket' && st.gear.rocket) st.gear.satchel = false; if (k === 'satchel' && st.gear.satchel) st.gear.rocket = false; build(); }));
  r = row('Fur'); Object.entries(FUR).forEach(([k, [l]]) => btn(r, l, st.fur === k, () => { st.fur = k; build(); }));
  r = row('Move'); ['idle', 'walk', 'run'].forEach(k => btn(r, k[0].toUpperCase() + k.slice(1), st.clip === k, () => { st.clip = k; s && s.play(k); }));
  btn(r, 'Scene: ' + BG[st.bg], false, () => { st.bg = (st.bg + 1) % BG.length; setBg(); });
  btn(r, st.spin ? 'Stop turning' : 'Turn', st.spin, () => { st.spin = !st.spin; });

</script>
