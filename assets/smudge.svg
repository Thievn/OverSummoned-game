<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="Smudge the otter">
  <defs>
    <style>
      .o{stroke:#1E2A47;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
      .fur{fill:#A8693F}.fur2{fill:#7E4A2B}.cream{fill:#FBE3C1}.ink{fill:#1E2A47}
    </style>
  </defs>
  <!-- tail -->
  <path class="o fur2" d="M262 300c56 18 104-2 122-46 8-20-10-30-24-18-22 22-54 30-98 20z"/>
  <!-- body -->
  <path class="o fur" d="M118 236c-20 40-22 104 10 134 22 20 122 22 146 0 30-30 28-96 8-134-34-34-132-34-164 0z"/>
  <path class="cream" d="M152 268c-12 30-10 70 8 88 16 14 64 14 80 0 18-18 20-58 8-88-22-20-74-20-96 0z"/>
  <!-- feet -->
  <ellipse class="o fur2" cx="152" cy="382" rx="34" ry="20"/>
  <ellipse class="o fur2" cx="250" cy="382" rx="34" ry="20"/>
  <!-- head -->
  <path class="o fur" d="M200 80c-96 0-144 42-144 100 0 62 58 96 144 96s144-34 144-96c0-58-48-100-144-100z"/>
  <!-- ears -->
  <circle class="o fur" cx="74" cy="128" r="17"/><circle class="fur2" cx="74" cy="129" r="7"/>
  <circle class="o fur" cx="326" cy="128" r="17"/><circle class="fur2" cx="326" cy="129" r="7"/>
  <path class="fur" d="M66 150c14-40 60-62 134-62s120 22 134 62z"/>
  <!-- muzzle -->
  <path class="cream" d="M200 160c-70 0-108 26-108 62 0 36 46 54 108 54s108-18 108-54c0-36-38-62-108-62z"/>
  <!-- eyes -->
  <ellipse class="ink" cx="138" cy="148" rx="17" ry="20"/>
  <ellipse class="ink" cx="262" cy="148" rx="17" ry="20"/>
  <circle fill="#fff" cx="144" cy="140" r="7"/><circle fill="#fff" cx="134" cy="154" r="3"/>
  <circle fill="#fff" cx="268" cy="140" r="7"/><circle fill="#fff" cx="258" cy="154" r="3"/>
  <!-- blush -->
  <ellipse fill="#FF8E8E" opacity=".55" cx="112" cy="214" rx="18" ry="10"/>
  <ellipse fill="#FF8E8E" opacity=".55" cx="288" cy="214" rx="18" ry="10"/>
  <!-- nose + mouth -->
  <path class="o ink" style="stroke-width:5" d="M180 192c0-11 40-11 40 0 0 13-11 19-20 19s-20-6-20-19z"/>
  <path fill="none" stroke="#1E2A47" stroke-width="6" stroke-linecap="round" d="M200 212v10m-20 2c8 10 16 8 20 0 4 8 12 10 20 0"/>
  <!-- whisker dots -->
  <g class="ink"><circle cx="158" cy="232" r="3.5"/><circle cx="144" cy="222" r="3.5"/><circle cx="242" cy="232" r="3.5"/><circle cx="256" cy="222" r="3.5"/></g><g stroke="#1E2A47" stroke-width="3.5" stroke-linecap="round"><path d="M120 222l-34-6M122 234l-32 6M280 222l34-6M278 234l32 6"/></g>
  <!-- paws up, mid-slap -->
  <path class="o fur2" d="M108 262c-26-8-42 10-34 30 8 18 34 18 46 4z"/>
  <path class="o fur2" d="M292 262c26-8 42 10 34 30-8 18-34 18-46 4z"/>
  <!-- ink smudge on the cheek -->
  <path class="ink" opacity=".85" d="M282 246c10-6 24-2 22 8-2 8-14 10-22 4-6-4-6-9 0-12z"/>
</svg>
