<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Smudge rig test · OverSummoned</title>
<link rel="stylesheet" href="css/os.css">
<style>
  body{margin:0;background:#0b1020;color:#e8edfb;font-family:system-ui,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
  h1{font:400 1.7rem "Lilita One",system-ui,sans-serif;margin:.2em 0}
  p{color:#aab6d6;margin:.3em 0 1em;line-height:1.45}
  .dbrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.dbrow{grid-template-columns:1fr}}
  .dbstage{position:relative;height:420px;border:2px solid #1f2b52;border-radius:16px;background:radial-gradient(ellipse at 50% 88%,#24335f 0,#111936 60%);overflow:hidden}
  .dbstage b{position:absolute;left:12px;top:10px;font-size:.85rem;letter-spacing:.3px;color:#dfe6fa;z-index:3}
  .dbstage canvas{position:absolute;inset:0;width:100%;height:100%}
  .dbbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .dbbar label{display:flex;align-items:center;gap:.4em;color:#aab6d6;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Smudge rig test</h1>
  <p>Left is the rig the site uses now. Right is the same cut parts as DragonBones files, played by the DragonBones runtime. Watch the tail: on the right it bends along its length.</p>
  <div class="dbrow">
    <div class="dbstage" id="old"><b>Current rig</b></div>
    <div class="dbstage" id="new"><b>DragonBones</b></div>
  </div>
  <div class="dbbar">
    <button class="btn" id="bStamp">Stamp</button>
    <button class="btn" id="bCheer">Cheer</button>
    <button class="btn" id="bTalk">Talk</button>
    <label><input type="checkbox" id="bBones"> Show bones</label>
  </div>
</div>
<script src="js/os.js"></script>
<script src="js/vendor/pixi.js"></script>
<script src="js/vendor/dragonBones.min.js"></script>
<script>
(async function () {
  const H = 420, S = 0.62;
  // ---- current rig
  let old = null;
  try {
    OS.rig = await (await fetch('data/rig.json')).json();
    const host = document.getElementById('old');
    old = new OS.Puppet(host, 'stamp', S); old.place(host.clientWidth / 2 + 10, H * 0.9);
  } catch (e) { console.error('old rig', e); }

  // ---- DragonBones
  const host = document.getElementById('new');
  const app = new PIXI.Application();
  await app.init({ width: host.clientWidth, height: H, backgroundAlpha: 0, antialias: true, resolution: Math.min(2, devicePixelRatio || 1), autoDensity: true });
  host.appendChild(app.canvas);
  const [ske, tex, png] = await Promise.all([
    fetch('assets/v2/db/smudge_ske.json').then(r => r.json()),
    fetch('assets/v2/db/smudge_tex.json').then(r => r.json()),
    PIXI.Assets.load('assets/v2/db/smudge_tex.webp')]);
  const f = dragonBones.PixiFactory.factory;
  f.parseDragonBonesData(ske); f.parseTextureAtlasData(tex, png);
  const a = f.buildArmatureDisplay('stamp', 'smudge');
  a.scale.set(S); a.x = host.clientWidth / 2 + 10; a.y = H * 0.9; app.stage.addChild(a);
  const an = a.animation;
  an.play('idle', 0);
  const over = (name, times, layer) => { const s = an.fadeIn(name, 0.06, times, layer, name); if (s) { s.resetToPose = false; s.autoFadeOutTime = 0.08; } return s; };
  (function blink() { over('blink', 1, 3); setTimeout(blink, 2200 + Math.random() * 3300); })();
  window.DB = { a, an, app, over };

  document.getElementById('bStamp').onclick = () => { over('stamp', 1, 1); if (old) { old.kick('arm', 22); old.kick('head', 2); } };
  document.getElementById('bCheer').onclick = () => { over('cheer', 8, 2); if (old) old.cheer(4); };
  document.getElementById('bTalk').onclick = () => { const s = over('talk', 4, 4); if (old) old.say(2.7); };
  document.getElementById('bBones').onchange = e => { a.debugDraw = e.target.checked; };
})();
</script>
</body>
</html>
